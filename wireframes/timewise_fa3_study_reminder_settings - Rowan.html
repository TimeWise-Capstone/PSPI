<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeWise — Study Reminder Settings</title>
    <style>
        :root {
            --bg: #f7f7f7; --panel: #ffffff; --border: #c9c9c9; --border-dark: #8d8d8d;
            --text: #222; --muted: #666; --soft: #ececec; --active: #dedede;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
        .app { width: 1365px; min-height: 768px; margin: 20px auto; background: var(--panel); border: 1px solid var(--border-dark); display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 70px 1fr; border-radius: 8px; overflow: hidden; }
        .topbar { grid-column: 1 / 3; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border-dark); background: #fff; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 24px; }
        .clock { width: 34px; height: 34px; border: 2px solid #333; border-radius: 50%; }
        .profile { border: 1px solid var(--border-dark); border-radius: 6px; padding: 10px 14px; font-size: 14px; background: #fff; }
        .sidebar { grid-row: 2; border-right: 1px solid var(--border-dark); padding: 20px 14px; background: #fafafa; }
        .nav-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 4px 10px 10px; }
        .nav a { display: block; text-decoration: none; color: var(--text); border: 1px solid transparent; padding: 12px 14px; margin-bottom: 6px; border-radius: 5px; font-size: 15px; }
        .nav a.active { background: var(--active); border-color: var(--border-dark); font-weight: 700; }
        .content { grid-column: 2; grid-row: 2; padding: 30px 34px 36px; background: #fff; overflow-y: auto; }
        h1 { margin: 0 0 6px; font-size: 26px; font-weight: 700; }
        .subtext { color: var(--muted); margin-bottom: 22px; font-size: 14px; }
        .panel { border: 1px solid var(--border-dark); border-radius: 6px; background: #fff; padding: 18px; max-width: 750px; }
        .panel h2 { font-size: 16px; margin: 0 0 14px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 8px 10px; border: 1px solid var(--border-dark); border-radius: 4px; font-size: 13px; }
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; font-size: 13px; }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn { display: inline-block; border: 1px solid var(--border-dark); background: #fff; color: var(--text); text-decoration: none; border-radius: 5px; padding: 8px 14px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn.primary { background: var(--soft); }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="brand"><div class="clock"></div><span>TimeWise</span></div>
        <div class="profile">Rowan McFaul (RM) ▾</div>
    </header>
    <aside class="sidebar">
        <div class="nav-title">Navigation</div>
        <nav class="nav">
            <a href="timewise_fa3_student_priority_dashboard - Rowan.html">Priority Dashboard</a>
            <a class="active" href="timewise_fa3_study_reminder_settings - Rowan.html">Reminder Settings</a>
            <a href="timewise_fa3_workload_heatmap - Rowan.html">Workload Heatmap</a>
        </nav>
    </aside>
    <main class="content">
        <h1>Study Reminder Settings</h1>
        <div class="subtext">Configure automated contextual notifications and alert timing prior to scheduled study blocks.</div>
        <div class="panel">
            <h2>Notification Preferences</h2>
            <div class="form-group">
                <label class="form-label">Default Notification Lead Time</label>
                <select class="form-input">
                    <option>15 Minutes Before Block</option>
                    <option>30 Minutes Before Block</option>
                    <option>1 Hour Before Block</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Active Notification Channels</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" checked /> In-App Banner Popups (Contextual Overlays)</label>
                    <label><input type="checkbox" checked /> Daily Academic Summary Email Digest</label>
                    <label><input type="checkbox" /> Mobile Push Notifications</label>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Urgency Threshold for High-Priority Alerts</label>
                <select class="form-input">
                    <option>Always alert for High & Medium priority tasks</option>
                    <option>Alert only for High priority / Imminent deadlines (&lt; 48 hours)</option>
                </select>
            </div>
            <div class="btn-row">
                <button class="btn primary">Save Preferences</button>
                <button class="btn">Reset to Default</button>
            </div>
        </div>
    </main>
</div>
</body>
</html>
